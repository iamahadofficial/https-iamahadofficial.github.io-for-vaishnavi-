<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy birthday Vaishnavi ❤️</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            height: 100vh; width: 100vw; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden; cursor: pointer;
            background-color: #eaf8f5;
            background-image: linear-gradient(#d1ebe6 1px, transparent 1px), linear-gradient(90deg, #d1ebe6 1px, transparent 1px);
            background-size: 60px 60px; background-position: center center;
        }

        .heading {
            font-family: 'Playfair Display', serif; color: #1a3c40; font-size: 38px;
            font-weight: 700; margin-bottom: 50px; text-align: center; z-index: 2; letter-spacing: 0.5px;
        }

        .balloon-container {
            z-index: 2; margin-bottom: 60px;
            transform: translateY(100vh); animation: slideUp 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .balloon {
            width: 220px; height: auto;
            animation: float 3s ease-in-out infinite alternate; animation-delay: 1.5s; 
        }

        .sub-text {
            font-family: 'Caveat', cursive; color: #2b5555; font-size: 32px; font-weight: 500; z-index: 2; letter-spacing: 1px;
        }

        @keyframes slideUp { 0% { transform: translateY(100vh); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes float { 0% { transform: translateY(0px); } 100% { transform: translateY(-12px); } }

        @media (max-width: 600px) {
            .heading { font-size: 28px; padding: 0 20px; }
            .balloon { width: 180px; }
            .sub-text { font-size: 26px; }
            body { background-size: 45px 45px; }
        }
    </style>
</head>
<body onclick="goToNextPage()">

    <h1 class="heading">Happy birthday Vaishnavi</h1>
    
    <div class="balloon-container">
        <img src="balloon.png" alt="Delivery Balloon" class="balloon">
    </div>
    
    <p class="sub-text">a delivery for you...</p>

    <!-- Hidden Audio Player for Autoplay -->
    <audio id="bg-music" src="song.mp3" loop></audio>

    <script>
        const music = document.getElementById("bg-music");

        window.onload = function() {
            // Naya session shuru hone par purana music time clear kar do
            sessionStorage.clear();
            
            // Try to autoplay music
            music.play().catch(error => {
                console.log("Browser blocked autoplay. It will start on first tap.");
            });
        };

        function goToNextPage() {
            // Jaise hi user tap karega, agar gaana nahi chal raha toh play hoga aur fir next page jayega
            music.play().then(() => {
                sessionStorage.setItem("savedMusicTime", music.currentTime);
                sessionStorage.setItem("isMusicPlaying", "true");
                window.location.href = "page2.html";
            }).catch(error => {
                window.location.href = "page2.html";
            });
        }
    </script>
</body>
</html>
